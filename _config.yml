# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'jekyll serve'. If you change this file, please restart the server process.

# Site settings
title: MEDical Image Computing Lab (MEDIC)
email: rdamseh@uaeu.ac.ae
description: >-
  AI and Machine Learning for Medical Image Computing and Automated Dignostics at
  UAEU
baseurl: "" # the subpath of your site, e.g. /blog
url: "" # the base hostname & protocol for your site

# Author settings
author:
  name: Dr. Rafat Damseh
  bio: >-
    Associate Professor in Computer Science and Software Engineering at UAEU.
  avatar: /assets/images/profile.jpg
  email: rdamseh@uaeu.ac.ae

# Lab information
lab:
  name: Medical Image Computing Lab
  head: Dr. Rafat Damseh
  university: UAEU
  department: Computer Science and Software Engineering
  college: College of Computing and Artificial Intelligence
  address: Room 3070, P.O. Box 15551, Al Ain, UAE

# News feed
# Public raw URL of the markdown file holding news items (e.g. a GitHub Gist raw link).
# Leave blank to hide the news list. See _pages/news.html for the expected format.
news_source: "https://gist.githubusercontent.com/Damseh/0a5647f0e57123d34d44d7e0597ce298/raw/news.md"

# Publications feed
# Public raw URL of a BibTeX (.bib) file — e.g. a GitHub Gist raw link.
# Use the URL WITHOUT a revision SHA so it always serves the latest version.
# Leave blank to hide the list.
publications_source: "https://gist.githubusercontent.com/Damseh/b3d2715b8fe61aa74f37b7eba5a2673a/raw/publications.bib"

# Social links
github_username: Damseh
google_scholar_id: vmQUi8AAAAAJ&hl=en&oi=ao
twitter_username: # Add if you have one

# Build settings
markdown: kramdown
theme: minima
plugins:
  - jekyll-feed

include:
  - .htaccess
  - _pages

sass:
  sass_dir: _sass

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false
  parse_block_html: true # default for kramdown is false. This will enable using Markdown links


